# Windows kurulum dosyası (NSIS .exe + .msi) — Mac'ten değil, burada üretilir.
# Çalıştırma: GitHub > Actions > "Windows kurulum" > Run workflow, ya da v* etiketi push'u.
# Gizli değişkenler (Settings > Secrets and variables > Actions):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  → Gmail (salt okuma) bağlantısı için
name: Windows kurulum

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # testdata/ depoda olmadığı için gerçek veri testleri kendiliğinden atlanır.
      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          args: --bundles nsis,msi
          # Etiketle çalışınca taslak sürüm oluşturur; elle çalışınca sadece yapıt yükler.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Bahatek Teklif {0}', github.ref_name) || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: bahatek-teklif-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
