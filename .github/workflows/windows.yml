# Windows kurulum dosyası (NSIS .exe + .msi) — Mac'ten değil, burada üretilir.
# Çalıştırma: GitHub > Actions > "Windows kurulum" > Run workflow, ya da v* etiketi push'u.
# Gizli değişkenler (Settings > Secrets and variables > Actions):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  → Gmail (salt okuma) bağlantısı için
name: Windows kurulum

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # testdata/ depoda olmadığı için gerçek veri testleri kendiliğinden atlanır.
      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Pre-fetch NSIS and WiX tools with retry (prevent GitHub 504)
        shell: pwsh
        run: |
          $nsisDir = "$env:LOCALAPPDATA\tauri\NSIS"
          $wixDir  = "$env:LOCALAPPDATA\tauri\WixTools314"
          New-Item -ItemType Directory -Force -Path $nsisDir, $wixDir | Out-Null
          curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" -o "$nsisDir\nsis.zip"
          Expand-Archive -Path "$nsisDir\nsis.zip" -DestinationPath "$env:LOCALAPPDATA\tauri" -Force
          if (Test-Path "$env:LOCALAPPDATA\tauri\nsis-3.11") {
            Copy-Item -Path "$env:LOCALAPPDATA\tauri\nsis-3.11\*" -Destination $nsisDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "$nsisDir\Plugins\x86-unicode" | Out-Null
          curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" -o "$nsisDir\Plugins\x86-unicode\nsis_tauri_utils.dll"
          curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -o "$wixDir\wix.zip"
          Expand-Archive -Path "$wixDir\wix.zip" -DestinationPath $wixDir -Force

      - uses: tauri-apps/tauri-action@v0
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --bundles nsis,msi
          # Etiketle çalışınca sürüm oluşturur; elle çalışınca sadece yapıt yükler.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Bahatek Teklif {0}', github.ref_name) || '' }}
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: bahatek-teklif-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
